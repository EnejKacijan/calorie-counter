[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/foods/search"
  to = "/.netlify/functions/foods-search"
  status = 200

[[redirects]]
  from = "/api/foods/analyze-image"
  to = "/.netlify/functions/foods-analyze-image"
  status = 200

[[redirects]]
  from = "/api/foods/correct-image-item"
  to = "/.netlify/functions/foods-correct-image-item"
  status = 200

[[redirects]]
  from = "/api/assistant/chat"
  to = "/.netlify/functions/nutrition-assistant"
  status = 200
